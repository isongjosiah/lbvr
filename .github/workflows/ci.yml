name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Skip if no Go files
        id: gate
        run: |
          if find . -name '*.go' -not -path './contracts/lib/*' | grep -q .; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
          fi
      - name: go vet
        if: steps.gate.outputs.has_go == 'true'
        run: go vet ./...
      - name: golangci-lint
        if: steps.gate.outputs.has_go == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
      - name: go test
        if: steps.gate.outputs.has_go == 'true'
        run: go test -race -cover ./...

  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Skip if no Solidity files
        id: gate
        run: |
          if find contracts/src contracts/test -name '*.sol' 2>/dev/null | grep -q .; then
            echo "has_sol=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sol=false" >> "$GITHUB_OUTPUT"
          fi
      - name: forge install
        if: steps.gate.outputs.has_sol == 'true'
        working-directory: contracts
        run: forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.1.0 || true
      - name: forge test
        if: steps.gate.outputs.has_sol == 'true'
        working-directory: contracts
        run: forge test -vvv

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            CLAUDE.md
            README.md
            docs/**/*.md
