[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# via-ir is required for PoRVerifier.respondToChallenge — the function
# has more locals than fit in the EVM stack with the legacy pipeline.
# Slightly slower compile; identical bytecode semantics.
via_ir = true
evm_version = "shanghai"
gas_reports = ["*"]
verbosity = 2

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256 }

[rpc_endpoints]
cardona = "${CARDONA_RPC_URL}"

[etherscan]
cardona = { key = "${POLYGONSCAN_API_KEY}", chain = 2442, url = "https://api-cardona-zkevm.polygonscan.com/api" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
