[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# via-ir is required for PoRVerifier.respondToChallenge — the function
# has more locals than fit in the EVM stack with the legacy pipeline.
# Slightly slower compile; identical bytecode semantics.
via_ir = true
# London target keeps the bytecode compatible with Geth forks that
# haven't enabled the Shanghai PUSH0 opcode (e.g., PureChain).
evm_version = "london"
gas_reports = ["*"]
verbosity = 2

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256 }

[rpc_endpoints]
# Generic CHAIN_RPC_URL is the canonical entry going forward; named
# aliases (cardona, purechain) preserved so prior deploy scripts still
# resolve. The paper references "an EVM-compatible chain" with the
# specific deployment chain stated in §V-A as a footnote.
chain     = "${CHAIN_RPC_URL}"
cardona   = "${CARDONA_RPC_URL}"
purechain = "${PURECHAIN_RPC_URL}"

[etherscan]
cardona = { key = "${POLYGONSCAN_API_KEY}", chain = 2442, url = "https://api-cardona-zkevm.polygonscan.com/api" }
# PureChain (PoA², Chain ID 900520900520, on-demand block time) — no
# Etherscan-style verifier as of D22; tx hashes verified manually via
# block explorer.

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
